<!DOCTYPE html>

<html lang="en">

  <head>

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Drumset</title>

  </head>

  <body>

    <h1>My Drumset!</h1>
    <p>Click the kick and snare. Double-click the crash. Press down on tom 1, release on tom 2. Hover over tom 3, move away from tom 4. Or press the space bar for the crash!</p>

    <img id="kick" src="Drumset/images/kick.png" />
    <img id="snare" src="Drumset/images/snare.png" />
    <img id="crash" src="Drumset/images/crash.png" />
    <img id="tom1" src="Drumset/images/tom1.png" />
    <img id="tom2" src="Drumset/images/tom2.png" />
    <img id="tom3" src="Drumset/images/tom3.png" />
    <img id="tom4" src="Drumset/images/tom4.png" />

    <script>

      //SELECTING

      let kickDrum = document.querySelector("#kick");
      let snareDrum = document.querySelector("#snare");
      let crashDrum = document.querySelector("#crash");
      let tom1Drum = document.querySelector("#tom1");
      let tom2Drum = document.querySelector("#tom2");
      let tom3Drum = document.querySelector("#tom3");
      let tom4Drum = document.querySelector("#tom4");

      //FUNCTIONS

      function playKick() {
        let kickSound = new Audio("Drumset/sounds/kick-bass.mp3");
        kickSound.play();
      }
      function playSnare() {
        let snareSound = new Audio("Drumset/sounds/snare.mp3");
        snareSound.play();
      }
      function playCrash() {
        let crashSound = new Audio("Drumset/sounds/crash.mp3");
        crashSound.play();
      }
      function playTom1() {
        let tom1Sound = new Audio("Drumset/sounds/tom-1.mp3");
        tom1Sound.play();
      }
      function playTom2() {
        let tom2Sound = new Audio("Drumset/sounds/tom-2.mp3");
        tom2Sound.play();
      }
      function playTom3() {
        let tom3Sound = new Audio("Drumset/sounds/tom-3.mp3");
        tom3Sound.play();
      }
      function playTom4() {
        let tom4Sound = new Audio("Drumset/sounds/tom-4.mp3");
        tom4Sound.play();
      }

      // LISTENERS
      kickDrum.addEventListener("click", playKick);
      snareDrum.addEventListener("click", playSnare);
      crashDrum.addEventListener("dblclick", playCrash);
      tom1Drum.addEventListener("mousedown", playTom1);
      tom2Drum.addEventListener("mouseup", playTom2);
      tom3Drum.addEventListener("mouseover", playTom3);
      tom4Drum.addEventListener("mouseleave", playTom4);

      // KEY EVENT
      function handleKeyDown(event) {
        if (event.code === "Space") {
          playCrash();
        }
      }

      window.addEventListener("keydown", handleKeyDown);

    </script>

  </body>
  
</html>

<!DOCTYPE html>

<html lang="en">

  <head>

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Functions</title>

  </head>

  <body>

    <script>

      // Function with no parameters
      function noParams() {
        alert("noParams was called.");
      }

      // Function with three parameters
      function threeParams(a, b, c) {
        alert("threeParams was called");
        alert("Parameter 1: " + a);
        alert("Parameter 2: " + b);
        alert("Parameter 3: " + c);
      }

      //Function that asks for a name and gives a customized greeting
      function greeting() {
        let username = prompt("What is your name? ");
        alert("Hello " + username);
      }

      //Calling the functions
      noParams();
      threeParams("This", "is", "awesome");
      greeting();

    </script>

  </body>

</html>

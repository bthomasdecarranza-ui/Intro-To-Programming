<!DOCTYPE html>

<html lang="en">

<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <script src="https://cdn.jsdelivr.net/npm/p5@1.11.13/lib/p5.min.js"></script>

</head>

<body>

<script>

const canvasHeight = 400;
const canvasWidth = canvasHeight * 1.5; 
const colors = ["red", "yellow", "black"];
let sunX = 0; // Sun's x coordinate starts at 0
let goRight

function setup() {
  createCanvas(canvasWidth, canvasHeight);
}

function draw() {
  background(150, 150, 150);
  drawSun();
  drawHouse();
  drawGrass();
}

function drawSun() {
    fill("yellow");
    circle(sunX, 0, canvasHeight);

    if (goRight) {
        sunX += 10;


        if (sunX > canvasWidth) {
        goRight = false;
    }

}


else {
    sunX -= 10;
     if (sunX < 0) {
        goRight = true;
    }
}

}

function drawHouse() {
    fill("purple");
    rect(canvasHeight/2,canvasHeight/2, canvasHeight/2, canvasHeight/2)
    fill("blue");
    triangle(canvasHeight/2, canvasHeight/2, canvasHeight, canvasHeight/2, canvasWidth/2, canvasHeight/4);
}

function drawGrass() {
    fill("green");
    let grassWidth = canvasHeight/10;
    let grassHeight = grassWidth;

    let start = canvasHeight;

    // Each time thorugh loop tracker increases by the width of the grass
    for (let tracker = 0; tracker < canvasWidth; tracker += grassWidth) {
        triangle(tracker, canvasHeight, tracker +grassWidth/2, canvasHeight-grassHeight, tracker + grassWidth, canvasHeight);
        console.log("Inside the for loop!" + tracker);
    }
    
}
</script>

</body>

</html>
